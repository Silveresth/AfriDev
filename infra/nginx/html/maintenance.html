<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfriDev — Maintenance en cours</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #f97316;
      --orange-light: #fed7aa;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--orange);
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }
    .logo svg { width: 2rem; height: 2rem; }

    .icon-wrap {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      background: rgba(249,115,22,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-wrap svg { width: 2rem; height: 2rem; color: var(--orange); }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.75rem 0;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.875rem;
    }
    .step-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--orange);
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }
    .step:not(:first-child) .step-dot { animation: none; background: var(--border); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .5; transform: scale(1.3); }
    }

    .eta {
      margin-top: 1.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      background: rgba(148,163,184,.1);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
    }
    .eta svg { width: 0.9rem; height: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" fill="#f97316" opacity=".2"/>
        <path d="M10 22 L16 10 L22 22" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12.5 18h7" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      AfriDev
    </div>

    <!-- Wrench icon -->
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>

    <h1>Maintenance en cours</h1>
    <p>Nous améliorons AfriDev Exchange pour vous offrir une meilleure expérience. Le site sera de retour très bientôt.</p>

    <hr class="divider">

    <div class="steps">
      <div class="step">
        <div class="step-dot"></div>
        <span>Mise à jour des fonctionnalités en cours…</span>
      </div>
      <div class="step">
        <div class="step-dot"></div>
        <span>Optimisation des performances</span>
      </div>
      <div class="step">
        <div class="step-dot"></div>
        <span>Tests de stabilité</span>
      </div>
    </div>

    <div class="eta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Retour prévu dans quelques heures
    </div>

  </div>
</body>
</html>
