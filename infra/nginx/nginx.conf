# Reverse proxy de production (derrière le CDN Cloudflare : HTTP/3 et Brotli côté CDN).
upstream django_app { server backend:8000; }
upstream next_app   { server web:3000; }
upstream powersync  { server powersync:8080; }

server {
  listen 80;
  server_name afridev.duckdns.org _;

  # Redirection HTTP vers HTTPS si SSL est disponible, sinon sert directement
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name afridev.duckdns.org _;

  ssl_certificate /etc/letsencrypt/live/afridev.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afridev.duckdns.org/privkey.pem;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }
  # Admin technique de Django (le back-office de la plateforme est /admin, servi par le site).
  location /django-admin/ {
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /ws/ {
    proxy_pass http://django_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
  location /sync/ {
    proxy_pass http://powersync/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
  # Médias enregistrés sur le VPS (envoyés avant Cloudinary, ou sans Cloudinary) : servis
  # directement par nginx, en lecture seule. Noms de fichiers uniques : cache long.
  location /media/ {
    alias /var/www/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  # CSS / JS de l'admin Django, rassemblés par collectstatic au démarrage du backend.
  location /static/ {
    alias /var/www/static/;
    expires 7d;
  }
  location = /sw.js {
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }
  location / {
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
