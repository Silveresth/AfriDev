# Reverse proxy de production (derrière le CDN Cloudflare : HTTP/3 et Brotli côté CDN).
upstream django_app { server backend:8000; }
upstream next_app   { server web:3000; }
upstream powersync  { server powersync:8080; }

server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  location /api/      { proxy_pass http://django_app; include /etc/nginx/proxy_params; }
  location /admin/    { proxy_pass http://django_app; include /etc/nginx/proxy_params; }
  location /ws/ {
    proxy_pass http://django_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location /sync/ {
    proxy_pass http://powersync/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location / { proxy_pass http://next_app; include /etc/nginx/proxy_params; }
}
