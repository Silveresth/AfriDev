# Reverse proxy de production (derrière le CDN Cloudflare : HTTP/3 et Brotli côté CDN).
upstream django_app { server backend:8000; }
upstream next_app   { server web:3000; }
upstream powersync  { server powersync:8080; }

# Journal d'accès persistant, lu par GoAccess (/opt/monitoring) : survit aux redéploiements,
# contrairement à stdout. Format « main » + temps de réponse. stdout reste actif (nginx.conf).
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for" $request_time';
access_log /var/log/afridev/access.log timed;

# Supervision : limite anti-bruteforce, et WebSocket (Grafana Live, GoAccess temps réel).
limit_req_zone $binary_remote_addr zone=monitoring:1m rate=10r/s;
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name afridev.duckdns.org _;

  # Redirection HTTP vers HTTPS si SSL est disponible, sinon sert directement
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name afridev.duckdns.org _;

  ssl_certificate /etc/letsencrypt/live/afridev.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afridev.duckdns.org/privkey.pem;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }
  # Admin technique de Django (le back-office de la plateforme est /admin, servi par le site).
  location /django-admin/ {
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /ws/ {
    proxy_pass http://django_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
  location /sync/ {
    proxy_pass http://powersync/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
  # Médias enregistrés sur le VPS (envoyés avant Cloudinary, ou sans Cloudinary) : servis
  # directement par nginx, en lecture seule. Noms de fichiers uniques : cache long.
  location /media/ {
    alias /var/www/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  # CSS / JS de l'admin Django, rassemblés par collectstatic au démarrage du backend.
  location /static/ {
    alias /var/www/static/;
    expires 7d;
  }
  # Supervision (stack /opt/monitoring) : Basic Auth, puis le login propre à Grafana.
  # Noms résolus à chaque requête (resolver Docker) : si la stack est arrêtée, le site démarre
  # quand même et seul /monitoring/ répond 502. Hors du journal GoAccess (stdout seulement).
  location /monitoring/ {
    auth_basic "AfriDev monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    limit_req zone=monitoring burst=60 nodelay;
    access_log /var/log/nginx/access.log main;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /monitoring/ {
      return 302 /monitoring/grafana/;
    }
    location /monitoring/grafana/ {
      set $grafana http://monitoring-grafana:3000;
      proxy_pass $grafana;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /monitoring/goaccess/ws {
      set $goaccess http://monitoring-goaccess:7890;
      proxy_pass $goaccess;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_read_timeout 1h;
    }
    location /monitoring/goaccess/ {
      alias /var/www/goaccess/;
      index index.html;
      add_header Cache-Control "no-store";
    }
  }
  location = /sw.js {
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }
  location / {
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
