# Reverse proxy de production (derrière le CDN Cloudflare : HTTP/3 et Brotli côté CDN).
upstream django_app { server backend:8000; }
upstream next_app   { server web:3000; }
upstream powersync  { server powersync:8080; }

# Secrets jamais écrits dans les journaux : jeton des WebSockets (?token=), code OAuth (?code=),
# lien de réinitialisation du mot de passe (?token=, aussi présent dans le Referer).
map $request $request_safe {
  "~^(?<before>.*[?&](?:token|access_token|code|code_verifier)=)[^&\s]*(?<after>.*)$" "${before}[masque]${after}";
  default $request;
}
map $http_referer $referer_safe {
  "~^(?<before>.*[?&](?:token|access_token|code|code_verifier)=)[^&]*(?<after>.*)$" "${before}[masque]${after}";
  default $http_referer;
}

# Journal d'accès persistant, lu par GoAccess (/opt/monitoring) : survit aux redéploiements,
# contrairement à stdout. Même contenu que « main », secrets masqués, plus le temps de réponse.
log_format timed '$remote_addr - $remote_user [$time_local] "$request_safe" '
                 '$status $body_bytes_sent "$referer_safe" '
                 '"$http_user_agent" "$http_x_forwarded_for" $request_time';
log_format safe '$remote_addr - $remote_user [$time_local] "$request_safe" '
                '$status $body_bytes_sent "$referer_safe" '
                '"$http_user_agent" "$http_x_forwarded_for"';

# Supervision : limite anti-bruteforce, et WebSocket (Netdata, GoAccess temps réel).
limit_req_zone $binary_remote_addr zone=monitoring:1m rate=10r/s;
# Admin technique de Django : sa page de connexion n'a pas de limite d'essais propre.
limit_req_zone $binary_remote_addr zone=django_admin:1m rate=30r/m;
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name afridev.duckdns.org _;
  # Remplacent le journal « main » de l'image (stdout) : mêmes lignes, secrets masqués.
  access_log /var/log/nginx/access.log safe;
  access_log /var/log/afridev/access.log timed;

  # Redirection HTTP vers HTTPS si SSL est disponible, sinon sert directement
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name afridev.duckdns.org _;

  ssl_certificate /etc/letsencrypt/live/afridev.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afridev.duckdns.org/privkey.pem;
  access_log /var/log/nginx/access.log safe;
  access_log /var/log/afridev/access.log timed;
  server_tokens off;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }
  # Admin technique de Django (le back-office de la plateforme est /admin, servi par le site).
  location /django-admin/ {
    limit_req zone=django_admin burst=20 nodelay;
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /ws/ {
    proxy_pass http://django_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
  location /sync/ {
    proxy_pass http://powersync/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
  # Médias enregistrés sur le VPS (envoyés avant Cloudinary, ou sans Cloudinary) : servis
  # directement par nginx, en lecture seule. Noms de fichiers uniques : cache long.
  # Défense en profondeur contre un fichier piégé (HTML, SVG…) : seuls les formats de média
  # gardent leur type ; tout le reste part en téléchargement brut, dans un bac à sable, jamais
  # interprété comme une page du site.
  location /media/ {
    alias /var/www/media/;
    types {
      image/jpeg jpg jpeg;
      image/png png;
      image/webp webp;
      image/avif avif;
      image/gif gif;
      video/mp4 mp4;
      video/quicktime mov;
      video/webm webm;
      video/3gpp 3gp;
      video/mp2t ts;
      application/vnd.apple.mpegurl m3u8;
      audio/webm weba;
      audio/mp4 m4a;
      audio/aac aac;
      audio/mpeg mp3;
      audio/ogg ogg;
      audio/opus opus;
      audio/wav wav;
    }
    default_type application/octet-stream;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  }
  # CSS / JS de l'admin Django, rassemblés par collectstatic au démarrage du backend.
  location /static/ {
    alias /var/www/static/;
    expires 7d;
  }
  # Supervision (stack /opt/monitoring) : Basic Auth devant Netdata et GoAccess.
  # Cibles résolues à chaque requête : si la stack est arrêtée, le site démarre quand même et
  # seul /monitoring/ répond 502. Hors du journal GoAccess (stdout seulement).
  location /monitoring/ {
    auth_basic "AfriDev monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    limit_req zone=monitoring burst=120 nodelay;
    access_log /var/log/nginx/access.log safe;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /monitoring/ {
      return 302 /monitoring/netdata/;
    }
    location = /monitoring/netdata {
      return 301 /monitoring/netdata/;
    }
    # Netdata tourne sur le réseau de l'hôte : joint par l'IP de docker0 (UFW : réseaux Docker seuls).
    location ~ ^/monitoring/netdata/(?<ndpath>.*)$ {
      proxy_pass http://172.17.0.1:19999/$ndpath$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_store off;
    }
    location = /monitoring/goaccess/ws {
      set $goaccess http://monitoring-goaccess:7890;
      proxy_pass $goaccess;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_read_timeout 1h;
    }
    location /monitoring/goaccess/ {
      alias /var/www/goaccess/;
      index index.html;
      add_header Cache-Control "no-store";
    }
  }
  location = /sw.js {
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }
  location / {
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
