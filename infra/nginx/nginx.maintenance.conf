# ──────────────────────────────────────────────────────────────────────────────
# AfriDev — Nginx MAINTENANCE MODE
# Lien secret pour accéder au site : https://afridev.duckdns.org/_preview/5CAO1L-vo-Rs99e7fIW8kA
# Pour désactiver : cp infra/nginx/nginx.conf.bak infra/nginx/nginx.conf
#                   docker compose up -d --force-recreate nginx
# ──────────────────────────────────────────────────────────────────────────────

upstream django_app { server backend:8000; }
upstream next_app   { server web:3000; }
upstream powersync  { server powersync:8080; }

# ── Serveur HTTP → HTTPS ──────────────────────────────────────────────────────
server {
  listen 80;
  server_name afridev.duckdns.org _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
  listen 443 ssl;
  server_name afridev.duckdns.org _;

  ssl_certificate     /etc/letsencrypt/live/afridev.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afridev.duckdns.org/privkey.pem;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;

  # ── Lien magique : pose le cookie preview et redirige vers / ──────────────
  # Visiter ce lien une fois dans le navigateur suffit (cookie 24h).
  location = /_preview/5CAO1L-vo-Rs99e7fIW8kA {
    add_header Set-Cookie "afridev_preview=5CAO1L-vo-Rs99e7fIW8kA; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400" always;
    return 302 /;
  }

  # ── Détection de la maintenance ───────────────────────────────────────────
  # maintenance_on = 1 par défaut → passe à 0 si le cookie secret est présent.
  set $maintenance_on 1;
  if ($cookie_afridev_preview = "5CAO1L-vo-Rs99e7fIW8kA") {
    set $maintenance_on 0;
  }

  # ── Routes normales (passent uniquement si cookie ok) ────────────────────

  location /api/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  location /django-admin/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://django_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }

  location /sync/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://powersync/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }

  location = /sw.js {
    if ($maintenance_on) { return 503; }
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }

  location / {
    if ($maintenance_on) { return 503; }
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Page de maintenance (renvoyée pour tous les 503) ──────────────────────
  error_page 503 @maintenance;
  location @maintenance {
    root /etc/nginx/html;
    try_files /maintenance.html =503;
    add_header Cache-Control "no-store, no-cache" always;
    add_header Retry-After "3600" always;
  }
}
