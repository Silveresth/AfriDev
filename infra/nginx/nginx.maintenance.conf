# Reverse proxy de production — mode MAINTENANCE actif
# Pour accéder au site : https://afridev.duckdns.org/?preview=5CAO1L-vo-Rs99e7fIW8kA
# Pour désactiver la maintenance : remplacer ce fichier par nginx.conf et recharger nginx.

upstream django_app { server backend:8000; }
upstream next_app   { server web:3000; }
upstream powersync  { server powersync:8080; }

# ─── Cookie "preview" : pose le cookie et redirige vers / ───────────────────
server {
  listen 80;
  listen 443 ssl;
  server_name afridev.duckdns.org _;

  ssl_certificate     /etc/letsencrypt/live/afridev.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/afridev.duckdns.org/privkey.pem;

  # Lien magique : pose le cookie et redirige
  location = /_preview_gate {
    add_header Set-Cookie "afridev_preview=5CAO1L-vo-Rs99e7fIW8kA; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400" always;
    return 302 /;
  }

  # Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirection HTTP → HTTPS
  if ($scheme = http) {
    return 301 https://$host$request_uri;
  }

  # ── Carte blanche si le cookie preview est présent ────────────────────────
  set $maintenance_on 1;
  if ($cookie_afridev_preview = "5CAO1L-vo-Rs99e7fIW8kA") {
    set $maintenance_on 0;
  }

  # ── Routes normales (actives uniquement si cookie ok) ─────────────────────
  location /api/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }

  location /admin/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://django_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://django_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }

  location /sync/ {
    if ($maintenance_on) { return 503; }
    proxy_pass http://powersync/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }

  location = /sw.js {
    if ($maintenance_on) { return 503; }
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  location / {
    if ($maintenance_on) { return 503; }
    proxy_pass http://next_app;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Page de maintenance (503) ──────────────────────────────────────────────
  error_page 503 @maintenance;
  location @maintenance {
    root /etc/nginx/html;
    try_files /maintenance.html =503;
    add_header Cache-Control "no-cache, no-store" always;
    add_header Retry-After "3600" always;
  }
}
