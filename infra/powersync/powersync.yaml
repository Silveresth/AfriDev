# Configuration du service PowerSync (copie SQLite locale <-> PostgreSQL).
replication:
  connections:
    - type: postgresql
      uri: postgresql://postgres:postgres@postgres:5432/afridev
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://postgres:postgres@postgres:5432/powersync_storage
  sslmode: disable

port: 8080

sync_rules:
  path: sync-rules.yaml

# Les jetons sont émis par Django (features/sync) et vérifiés via sa clé publique.
# « backend » : nom du conteneur sur le réseau Docker (host.docker.internal n'existe pas sous
# Linux, d'où des jetons jamais validés en production).
client_auth:
  jwks_uri: http://backend:8000/api/sync/jwks/
  audience: ["powersync"]
