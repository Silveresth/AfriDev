name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afridev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      # Les tests tournent sur PostgreSQL + pgvector (index HNSW, distance cosinus).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/afridev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Frontières entre features (import-linter)
        run: uv run lint-imports
      - name: Migrations à jour
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Schéma OpenAPI sans avertissement
        run: uv run python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (dont eslint-plugin-boundaries)
        run: pnpm lint
      - run: pnpm typecheck

  web-e2e-low-network:
    # Playwright en « 3G lente » et hors ligne, à chaque PR.
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web build
      - run: pnpm --filter web test:e2e
