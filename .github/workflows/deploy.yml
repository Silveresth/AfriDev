name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "REPO_OWNER=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile
          push: true
          no-cache: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/afridev-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://afridev.duckdns.org
            NEXT_PUBLIC_POWERSYNC_URL=https://afridev.duckdns.org/sync
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          build-contexts: |
            security-guard=packages/validation/src/security-guard
          push: true
          no-cache: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/afridev-backend:latest
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /var/www/AfriDev
            git reset --hard HEAD
            git clean -fd
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.REPO_OWNER }}/afridev-web:latest
            docker pull ghcr.io/${{ env.REPO_OWNER }}/afridev-backend:latest
            docker compose up -d postgres redis meilisearch powersync
            chmod +x scripts/check-postgres-roles.sh && bash scripts/check-postgres-roles.sh
            # --no-build : l'image vient de GHCR (construite plus haut), jamais d'un build local.
            docker compose up -d --no-build backend celery celery-ai celery-beat
            IMAGE_WEB=ghcr.io/${{ env.REPO_OWNER }}/afridev-web:latest docker compose up -d --force-recreate --no-build web
            # Recréé (et non redémarré) : applique aussi les nouveaux montages de volumes.
            docker compose up -d --force-recreate --no-build nginx
            docker compose ps
            docker compose logs --tail=20 web
            docker compose logs --tail=20 backend
            docker image prune -af
