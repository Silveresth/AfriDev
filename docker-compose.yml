# docker-compose.yml - Orchestration complète AfriDev Exchange
name: afridev

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-afridev}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.16
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/powersync:/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    # Image construite par la CI (deploy.yml) ; « build » sert au développement local.
    image: ${IMAGE_BACKEND:-ghcr.io/silveresth/afridev-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        security-guard: ./packages/validation/src/security-guard
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Vérifie que Postgres répond avant de lancer les migrations et le serveur ASGI.
    command: ["sh", "-c", "until python -c 'import psycopg, os; psycopg.connect(os.environ.get(\"DATABASE_URL\"))' 2>/dev/null; do echo 'Attente de la base de données...'; sleep 2; done; python manage.py migrate --noinput && python manage.py collectstatic --noinput -v 0 && exec daphne -b 0.0.0.0 -p 8000 config.asgi:application"]
    env_file:
      - .env
    environment:
      # Production : DJANGO_SETTINGS_MODULE=config.settings.prod dans le .env du VPS (voir CONFIGURATION.md).
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-afridev}}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MEILISEARCH_URL: http://meilisearch:7700
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://localhost:8081,https://afridev.duckdns.org
      CSRF_TRUSTED_ORIGINS: https://afridev.duckdns.org
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/media:/app/media
      # Fichiers de l'admin Django (collectstatic), servis par nginx sous /static/.
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    # Image construite par la CI (deploy.yml) ; « build » sert au développement local.
    image: ${IMAGE_BACKEND:-ghcr.io/silveresth/afridev-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        security-guard: ./packages/validation/src/security-guard
    restart: unless-stopped
    mem_limit: 512m
    # Files rapides et critiques (OTP par SMS, transcodage, GitHub). L'IA a son worker dédié.
    command: ["sh", "-c", "until python -c 'import psycopg, os; psycopg.connect(os.environ.get(\"DATABASE_URL\"))' 2>/dev/null; do echo 'Attente de la base de données pour Celery...'; sleep 2; done; exec celery -A config worker -n main@%h -l info -Q sms,default,github --concurrency=2 --max-tasks-per-child=200"]
    env_file:
      - .env
    environment: &celery-env
      # Production : DJANGO_SETTINGS_MODULE=config.settings.prod dans le .env du VPS (voir CONFIGURATION.md).
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-afridev}}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
    # Le transcodage lit et écrit les fichiers enregistrés par le backend.
    volumes: &media-volume
      - ./backend/media:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started

  # Worker IA (Groq, Whisper, embeddings) : un seul processus, les appels attendent surtout
  # le réseau. Isolé, il ne peut pas retarder un SMS d'OTP ; limites de durée : AI_TASK_SOFT_TIME_LIMIT.
  celery-ai:
    # Image construite par la CI (deploy.yml) ; « build » sert au développement local.
    image: ${IMAGE_BACKEND:-ghcr.io/silveresth/afridev-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        security-guard: ./packages/validation/src/security-guard
    restart: unless-stopped
    mem_limit: 320m
    command: ["sh", "-c", "until python -c 'import psycopg, os; psycopg.connect(os.environ.get(\"DATABASE_URL\"))' 2>/dev/null; do echo 'Attente de la base de données pour Celery IA...'; sleep 2; done; exec celery -A config worker -n ai@%h -l info -Q ai --concurrency=1 --max-tasks-per-child=100"]
    env_file:
      - .env
    environment: *celery-env
    volumes: *media-volume
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started

  # Tâches planifiées (CELERY_BEAT_SCHEDULE) : résumé du matin de l'assistant IA. Un seul
  # processus léger qui met des tâches en file ; les workers ci-dessus les exécutent.
  celery-beat:
    image: ${IMAGE_BACKEND:-ghcr.io/silveresth/afridev-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        security-guard: ./packages/validation/src/security-guard
    restart: unless-stopped
    mem_limit: 160m
    command: ["sh", "-c", "until python -c 'import psycopg, os; psycopg.connect(os.environ.get(\"DATABASE_URL\"))' 2>/dev/null; do echo 'Attente de la base de données pour Celery beat...'; sleep 2; done; exec celery -A config beat -l info --schedule /tmp/celerybeat-schedule"]
    env_file:
      - .env
    environment: *celery-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started

  web:
    image: ${IMAGE_WEB:-ghcr.io/silveresth/afridev-web:latest}
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: https://afridev.duckdns.org
      NEXT_PUBLIC_POWERSYNC_URL: https://afridev.duckdns.org/sync
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/html:/etc/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Médias stockés sur le VPS, servis par nginx (location /media/).
      - ./backend/media:/var/www/media:ro
      - ./backend/staticfiles:/var/www/static:ro
      # Journal d'accès persistant (lu par GoAccess) et supervision (/opt/monitoring, VPS).
      - /var/log/afridev/nginx:/var/log/afridev
      - /opt/monitoring/htpasswd:/etc/nginx/monitoring.htpasswd:ro
      - /opt/monitoring/goaccess/html:/var/www/goaccess:ro
      # Défi ACME : Certbot renouvelle en mode webroot sans arrêter nginx.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - web
      - powersync

volumes:
  postgres-data:
  meili-data:
